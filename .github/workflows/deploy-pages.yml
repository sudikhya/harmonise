name: Deploy Harmonise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Exclude API routes from the static export
        # Route handlers need a Node server, which Pages cannot run. The client
        # already degrades honestly without them (login reports unreachable,
        # the adviser shows its retry state). CI workspace only; not committed.
        run: rm -rf src/app/api
      - name: Build static site
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: "1"
          NEXT_BASE_PATH: /harmonise
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
